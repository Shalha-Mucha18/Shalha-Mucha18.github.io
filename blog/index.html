<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog | Md. Shalha Mucha Bhuyan</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" crossorigin="anonymous">
  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <!-- Site CSS -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/assets/img/favicon.png">

  <style>
    :root{
      --text:#121212; --muted:#6b7280; --border:#e5e7eb; --bg:#ffffff; --bg-soft:#f7f7f8; --link:#3b82f6;
    }
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    /* Navbar */
    .navbar{border-bottom:1px solid var(--border);background:#fff}
    /* Hero */
    .blog-hero{background:var(--bg-soft); border-bottom:1px solid var(--border); padding:72px 0 48px}
    .blog-hero h1{font-weight:800; letter-spacing:.3px; font-size:48px; margin:0 0 8px}
    .blog-hero p{color:var(--muted); font-size:18px; margin:0}
    /* Controls */
    .blog-controls{gap:12px}
    .chip{border:1px solid var(--border); padding:6px 12px; border-radius:999px; font-size:14px; color:#374151; background:#fff; cursor:pointer}
    .chip.active{border-color:var(--link); color:var(--link); background:#eef4ff}
    .search{border:1px solid var(--border); border-radius:12px; padding:10px 14px; width:100%}
    /* Cards */
    .post-card{border:1px solid var(--border); border-radius:16px; padding:22px; transition:transform .12s ease, box-shadow .12s ease; background:#fff}
    .post-card:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.06)}
    .post-title{font-size:22px; font-weight:700; margin-bottom:6px}
    .post-meta{font-size:13px; color:var(--muted)}
    .post-excerpt{font-size:15px; color:#374151; margin-top:8px}
    .post-tags .tag{font-size:12px; border:1px solid var(--border); padding:3px 8px; border-radius:999px; color:#374151; margin-right:6px}
    .read-more{font-weight:600; font-size:14px; color:var(--link)}
    /* Pagination */
    .pager .page-link{border-radius:10px; border:1px solid var(--border); color:#374151}
    .pager .page-item.active .page-link{background:var(--link); border-color:var(--link)}
    /* Responsive */
    @media(max-width:576px){ .blog-hero{padding:56px 0 32px} .blog-hero h1{font-size:36px} }
  </style>
</head>
